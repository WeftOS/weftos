# Owner ledger for scripts/diff-gate.sh: approval rows the owner has already decided on.
#
# OWNER ONLY. Any change to this file is an `approvals-change` finding that fails the gate
# unless the owner sets DIFF_GATE_OWNER_APPROVED=1 (CI: repository variable or the PR label
# `diff-gate-approved`). The gate reads this file from the BASE of the diff, never from the
# change under review, so an entry added in a diff cannot clear a row added in that diff.
#
# A row added to config/diff-gate-approvals.toml passes `approvals-change` only when its sha256
# is listed here on the base. Removed or edited rows always need the owner flag.
#
# sha256 is over the canonical row text, built from the parsed values:
#   rule=<rule>\npath=<path>\npattern=<pattern>\nreason=<reason>\napproved_by=<approved_by>\n
# Print it for every row of a file with:  scripts/diff-gate.sh --ledger-hash [FILE]
#
# To revoke a decision, remove its entries here as well as the rows (both owner-only).
#
#   [[entry]]
#   decision = "mathew-2026-11-14-1746-a134bcf7"   # decision id (decision file / card)
#   date     = "2026-11-14"
#   sha256   = "<64 hex>"
#   note     = "rule path"                          # optional, informational

