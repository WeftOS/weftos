# Owner-approved exceptions for scripts/diff-gate.sh (the pre-build diff gate).
#
# OWNER ONLY. Agents and automated lanes must never add, edit or remove entries here,
# and must never set DIFF_GATE_OWNER_APPROVED. Any change to this file is itself a
# finding (rule `approvals-change`) that fails the gate unless the owner sets
# DIFF_GATE_OWNER_APPROVED=1 locally, or the repository variable
# DIFF_GATE_OWNER_APPROVED=1 / the PR label `diff-gate-approved` in CI (maintainers only).
#
# An approved finding is reported as "approved" and does not fail the gate.
# Each entry needs all five keys:
#
#   [[approval]]
#   rule        = "unsafe"            # unsafe | new-dep | build-script | proc-macro | net |
#                                     # process | ffi | ci-workflow
#   path        = "crates/foo/**"     # glob: * stays inside a directory, ** crosses them
#   pattern     = "unsafe { libc::"   # substring or regex of the ADDED line; "*" = whole file
#   reason      = "why this is safe"
#   approved_by = "owner"
#
# Use single quotes for regex patterns so backslashes stay literal:
#   pattern = 'Command::new\("git"\)'
#
# Entries apply to any diff, so keep path and pattern as narrow as the need.
# Entries follow.

# Approved by the owner in chat on 2026-10-30 for ADR-129 (branch wt/pq-crypto).
[[approval]]
rule        = "new-dep"
path        = "**/Cargo.toml"
pattern     = 'rvf-(crypto|wire)([[:space:]]*=|\])'
reason      = "ADR-129: upstream rvf-crypto/rvf-wire replace the weftos-rvf-crypto/wire forks"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "Cargo.toml"
pattern     = '(^|[^-[:alnum:]])ml-dsa[[:space:]]*='
reason      = "ADR-129: RustCrypto ml-dsa 0.1.1, pure Rust, real ML-DSA-65 (pqcrypto unmaintained, RUSTSEC-2026-0162/0163/0166)"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "crates/weftos-pq-sign/Cargo.toml"
pattern     = '(^|[^-[:alnum:]])ml-dsa[[:space:]]*='
reason      = "ADR-129: weftos-pq-sign uses the workspace ml-dsa"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "**/Cargo.toml"
pattern     = 'weftos-pq-sign([[:space:]]*=|\])'
reason      = "ADR-129: in-tree ML-DSA-65 dual-signing crate"
approved_by = "owner"
