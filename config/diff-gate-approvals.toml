# Vault V1 (spec: docs/research/vault-v0-format-spec-2026-11-15.md, card a6f0b37d; V1 card 02301ad0):
# Argon2id passcode wrapper. argon2 =0.5.3, MIT OR Apache-2.0, pure Rust (RustCrypto). Lock adds
# argon2 0.5.3 and password-hash 0.5.0; reuses blake2 0.10.6. Approved by the owner 2026-11-15 10:09
# (instruction 20261115-1010 item 2; proposal scratch/mathew-proposal-20261115-vault-v1-argon2-row.md).
[[approval]]
rule        = "new-dep"
path        = "Cargo.toml"
pattern     = '(^|[^-[:alnum:]])argon2[[:space:]]*='
reason      = "Vault V1: argon2 =0.5.3 (MIT OR Apache-2.0) for the Argon2id passcode wrapper; adds argon2 and password-hash 0.5.0 to Cargo.lock, reuses blake2 0.10.6"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "crates/weftos-vault/Cargo.toml"
pattern     = '(^|[^-[:alnum:]])argon2[[:space:]]*='
reason      = "Vault V1: weftos-vault uses the workspace argon2"
approved_by = "owner"

# Vault V1 companion rows, approved by the owner 2026-11-15 12:47 PM ET (instruction 20261115-1248 item 2).
# hkdf 0.12.4 and unicode-normalization 0.1.26 are already in Cargo.lock; these make them direct deps.
[[approval]]
rule        = "new-dep"
path        = "Cargo.toml"
pattern     = '(^|[^-[:alnum:]])(hkdf|unicode-normalization)[[:space:]]*='
reason      = "Vault V1: HKDF-SHA256 key derivation and NFKC passcode normalization (both MIT OR Apache-2.0, already locked, no new lock package)"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "crates/weftos-vault/Cargo.toml"
pattern     = '(^|[^-[:alnum:]])(hkdf|unicode-normalization)[[:space:]]*='
reason      = "Vault V1: weftos-vault uses the workspace hkdf and unicode-normalization"
approved_by = "owner"

# Rows carried from w2/card-65f82b13 (computer hub, owner D1 2026-11-09; re-confirmed 2026-11-15 10:09).
# Approved by the owner (Mathew) on 2026-11-09, Tapestry Phase 3 decision D1: the computer hub
# runs as a service inside the WeftOS daemon, one per mesh. The owner stated that D1 covers the
# hub's new dependencies and network findings (instructions file
# tapestry-owner-instructions-20261109-1156-phase3-d1-d6.txt plus the owner's relayed answer of
# 2026-11-09). Rows recorded by the Tapestry lead on the owner's behalf; branch feat/computer-hub-service.
[[approval]]
rule        = "new-dep"
path        = "crates/weft-computer-hub/Cargo.toml"
pattern     = 'xai-tool-protocol[[:space:]]*=[[:space:]]*\{[[:space:]]*git[[:space:]]*=[[:space:]]*"https://github.com/WeftOS/grok-build",[[:space:]]*rev[[:space:]]*=[[:space:]]*"30302eb1"'
reason      = "D1 (owner 2026-11-09): hub wire protocol from the Tapestry fork, pinned to rev 30302eb1"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "crates/weft-computer-hub/Cargo.toml"
pattern     = '(^|[^-[:alnum:]_])(tokio|tokio-tungstenite|futures-util|serde|serde_json|toml|hmac|sha2|base64|uuid|tracing|tracing-subscriber|tempfile)[[:space:]]*='
reason      = "D1 (owner 2026-11-09): the hub crate's standard deps (tokio, websocket, serde, toml, HMAC/SHA-256 passkeys, base64, uuid, tracing; tempfile for tests)"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "crates/clawft-weave/Cargo.toml"
pattern     = 'weft-computer-hub[[:space:]]*=[[:space:]]*\{[[:space:]]*path[[:space:]]*=[[:space:]]*"../weft-computer-hub",[[:space:]]*optional[[:space:]]*=[[:space:]]*true'
reason      = "D1 (owner 2026-11-09): the daemon hosts the hub, behind the off-by-default computer-hub feature"
approved_by = "owner"

[[approval]]
rule        = "net"
path        = "crates/weft-computer-hub/src/**"
pattern     = '(TcpListener|TcpStream)'
reason      = "D1 (owner 2026-11-09): hub websocket listener; loopback unless hub.toml sets allow_non_loopback"
approved_by = "owner"

[[approval]]
rule        = "net"
path        = "crates/weft-computer-hub/tests/**"
pattern     = '(TcpListener|TcpStream)'
reason      = "D1 (owner 2026-11-09): hub tests bind an ephemeral loopback port and connect to it"
approved_by = "owner"

[[approval]]
rule        = "net"
path        = "crates/clawft-weave/src/computer_hub_svc.rs"
pattern     = 'TcpListener'
reason      = "D1 (owner 2026-11-09): in-daemon hub listener, started only when <runtime dir>/computer-hub/hub.toml exists; loopback by default"
approved_by = "owner"

