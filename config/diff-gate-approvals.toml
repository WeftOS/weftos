rule        = "new-dep"
path        = "crates/weftos-release/Cargo.toml"
pattern     = 'weftos-store[[:space:]]*='
reason      = "ADR-126 S5/S4: optional weftos-store path dep for the store feature (ReleaseBackend over ObjectBackend) and for S1 x S4 integration tests"
approved_by = "owner"

[[approval]]
rule        = "new-dep"
path        = "crates/weftos-release/Cargo.toml"
pattern     = 'weftos-edge-creds[[:space:]]*='
approved_by = "owner"
reason      = "ADR-126 S5/S4: test-only path dep for S1 x S3 chain-feed integration tests"

# Approved by the owner in chat on 2026-11-09 ~12:53 PM ET (card answering t221s1013)
# for ADR-126 S4: clawft-weave depends on weftos-release with the store feature.
[[approval]]
rule        = "new-dep"
path        = "crates/clawft-weave/Cargo.toml"
pattern     = 'weftos-release[[:space:]]*='
reason      = "ADR-126 S4: daemon depends on weftos-release with the store feature (release stores over weftos-store)"
approved_by = "owner"

# Approved by the owner on 2026-11-09 (card t213s943) for the ADR-126 S1 store_ingest receiver
# (RustFS audit/notification webhooks) and the weftos-store canned RustFS test servers.
[[approval]]
rule        = "net"
path        = "crates/clawft-weave/src/store_ingest.rs"
pattern     = 'TcpListener'
reason      = "ADR-126 S1: loopback-only listener (127.0.0.1, POST only, 1 MiB cap, secret path token) receiving RustFS audit/notification webhooks; off unless WEFTOS_STORE_INGEST_ADDR is set"
approved_by = "owner"

[[approval]]
rule        = "net"
path        = "crates/clawft-weave/src/store_ingest_tests.rs"
pattern     = '(TcpStream|TcpListener)'
reason      = "ADR-126 S1: tests talk to the receiver and bind a free loopback port"
approved_by = "owner"

[[approval]]
rule        = "process"
path        = "crates/clawft-weave/src/store_ingest_tests.rs"
pattern     = 'std::process::|Command::new'
reason      = "ADR-126 S1: the ignored live test starts a throwaway loopback RustFS binary named by WEFTOS_STORE_TEST_RUSTFS_BIN"
approved_by = "owner"

[[approval]]
rule        = "net"
path        = "crates/weftos-store/src/rustfs_tests.rs"
pattern     = 'std::net::TcpListener::bind\("127.0.0.1:0"\)'
reason      = "ADR-126 S1: two local-only canned RustFS test servers (Canned::start and the checksum-header test) on an ephemeral loopback port"
approved_by = "owner"

[[approval]]
rule        = "process"
path        = "crates/clawft-weave/tests/kernel_restart_e2e.rs"
pattern     = 'Command::new\(env!\("CARGO_BIN_EXE_weaver"\)\)'
reason      = "WO-089: the restart e2e spawns the crate's own weaver binary under a throwaway HOME/runtime dir; no external program"
approved_by = "owner"

