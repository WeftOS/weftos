<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d"><title id="t">Sensor to vector</title><desc id="d">A cog reads one piece of hardware, such as a radar, time-of-flight imager, ECG front end, microphone or IMU, and emits one JSON line per window plus an eight-float vector. The vector goes to the Seed vector store through the ingest endpoint, or onto a cogbus topic that other cogs and exposed peers can read.</desc><style>text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.t{font-size:15px;font-weight:600;fill:#eaf0f8}.tb{font-size:17px;font-weight:700;fill:#eaf0f8}.s{font-size:13px;fill:#9fb0c8}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#8fd3ff}.h{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#9fb0c8}.bn{font-size:12px;font-weight:700;fill:#0b1220}.cap{font-size:13px;fill:#eaf0f8}.hid{opacity:0}.an{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}@keyframes k1{0%,8.0%{opacity:0;transform:translate(0,0)}9.5%{opacity:1;transform:translate(0,0)}20.0%{opacity:1;transform:translate(60px,0px)}21.5%,100%{opacity:0;transform:translate(60px,0px)}}.k1{animation-name:k1}@keyframes k2{0%,20.0%{opacity:0}23.5%{opacity:1}46.0%,100%{opacity:0}}.k2{animation-name:k2}@keyframes k3{0%,38.0%{opacity:0;transform:translate(0,0)}39.5%{opacity:1;transform:translate(0,0)}48.0%{opacity:1;transform:translate(60px,0px)}49.5%,100%{opacity:0;transform:translate(60px,0px)}}.k3{animation-name:k3}@keyframes k4{0%,56.0%{opacity:0;transform:translate(0,0)}57.5%{opacity:1;transform:translate(0,0)}60.0%{opacity:1;transform:translate(20px,0px)}64.0%{opacity:1;transform:translate(20px,-55px)}68.0%{opacity:1;transform:translate(40px,-55px)}69.5%,100%{opacity:0;transform:translate(40px,-55px)}}.k4{animation-name:k4}@keyframes k5{0%,66.0%{opacity:0;transform:translate(0,0)}67.5%{opacity:1;transform:translate(0,0)}70.0%{opacity:1;transform:translate(20px,0px)}74.0%{opacity:1;transform:translate(20px,59px)}78.0%{opacity:1;transform:translate(40px,59px)}79.5%,100%{opacity:0;transform:translate(40px,59px)}}.k5{animation-name:k5}@media (prefers-reduced-motion:reduce){.an{animation:none!important}}</style><rect width="960" height="400" rx="16" fill="#0b1220"/><rect x="0.5" y="0.5" width="959" height="399" rx="15.5" fill="none" stroke="#2b3b58"/><text x="28" y="38" class="h">SENSOR TO VECTOR</text><rect x="28" y="96" width="180" height="150" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="28" y="106" width="3" height="130" rx="1.5" fill="#fbbf24"/><text x="44" y="124" class="t">Hardware</text><text x="44" y="146" class="s">one device:</text><text x="44" y="164" class="s">radar, ToF, ECG,</text><text x="44" y="182" class="s">mic or IMU</text><rect x="268" y="96" width="200" height="150" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="268" y="106" width="3" height="130" rx="1.5" fill="#5b9dff"/><text x="284" y="124" class="t">Cog</text><text x="284" y="146" class="s">cog.toml (typed config)</text><text x="284" y="164" class="s">reads, windows,</text><text x="284" y="182" class="s">extracts features</text><rect x="528" y="82" width="190" height="178" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="528" y="92" width="3" height="158" rx="1.5" fill="#2dd4bf"/><text x="544" y="110" class="t">Output per window</text><text x="544" y="136" class="s">1. a JSON line</text><text x="544" y="156" class="m" style="font-size:11px">{"..."}</text><text x="544" y="184" class="s">2. an 8-float vector</text><rect x="544" y="202" width="12" height="34" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="564" y="218" width="12" height="18" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="584" y="192" width="12" height="44" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="604" y="210" width="12" height="26" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="624" y="184" width="12" height="52" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="644" y="214" width="12" height="22" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="664" y="198" width="12" height="38" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="684" y="206" width="12" height="30" rx="3" fill="#2dd4bf" opacity=".85"/><rect x="758" y="70" width="182" height="92" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="758" y="80" width="3" height="72" rx="1.5" fill="#a78bfa"/><text x="774" y="98" class="t">Seed store</text><text x="774" y="120" class="s">POST to the ingest endpoint</text><text x="774" y="138" class="m">/api/v1/store/ingest</text><rect x="758" y="184" width="182" height="92" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="758" y="194" width="3" height="72" rx="1.5" fill="#5b9dff"/><text x="774" y="212" class="t">Cogbus topic</text><text x="774" y="234" class="s">readable by other cogs</text><text x="774" y="252" class="m">store.vector/&lt;id&gt;</text><path d="M208 171 H268" stroke="#2b3b58" stroke-width="2"/><path d="M468 171 H528" stroke="#2b3b58" stroke-width="2"/><path d="M718 171 H738 V116 H758 M738 171 V230 H758" fill="none" stroke="#2b3b58" stroke-width="2"/><path d="M40 226 q10 -16 20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#fbbf24" stroke-width="2" opacity=".7"/><g class="an k1 hid"><circle cx="208" cy="171" r="5" fill="#fbbf24"/></g><g class="an k2 hid"><rect x="266" y="94" width="204" height="154" rx="12" fill="none" stroke="#5b9dff" stroke-width="2.5"/></g><g class="an k3 hid"><circle cx="468" cy="171" r="5" fill="#2dd4bf"/></g><g class="an k4 hid"><circle cx="718" cy="171" r="5" fill="#a78bfa"/></g><g class="an k5 hid"><circle cx="718" cy="171" r="5" fill="#5b9dff"/></g><text x="28" y="318" class="s">Released cogs can still post vectors over HTTP; they land in the store of the project that placed the cog.</text><text x="28" y="340" class="s">New cogs publish through cogbus. A cogbus topic is local to the node until an operator exposes it.</text><text x="28" y="372" class="s">Each cog also ships tests and a rendered guide/ page (ADR-104).</text></svg>
