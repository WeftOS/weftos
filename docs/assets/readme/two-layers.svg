<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="t d"><title id="t">WeftOS: two layers</title><desc id="d">The agent framework (providers, channels, tools, skills and the weft CLI) runs on a cognitive OS (process table, typed IPC, governance, the ExoChain audit chain, operated with weaver). A message entering through weft becomes a kernel process, is checked by governance and is recorded on the chain.</desc><style>text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.t{font-size:15px;font-weight:600;fill:#eaf0f8}.tb{font-size:17px;font-weight:700;fill:#eaf0f8}.s{font-size:13px;fill:#9fb0c8}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#8fd3ff}.h{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#9fb0c8}.bn{font-size:12px;font-weight:700;fill:#0b1220}.cap{font-size:13px;fill:#eaf0f8}.hid{opacity:0}.an{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}@keyframes k1{0%,8.0%{opacity:0}11.5%{opacity:1}32.0%,100%{opacity:0}}.k1{animation-name:k1}@keyframes k2{0%,26.0%{opacity:0}29.5%{opacity:1}50.0%,100%{opacity:0}}.k2{animation-name:k2}@keyframes k3{0%,46.0%{opacity:0}49.5%{opacity:1}70.0%,100%{opacity:0}}.k3{animation-name:k3}@keyframes k4{0%,64.0%{opacity:0}67.5%{opacity:1}88.0%,100%{opacity:0}}.k4{animation-name:k4}@keyframes k5{0%,8.0%{opacity:0;transform:translate(0,0)}10.5%{opacity:1;transform:translate(0,0)}22.0%{opacity:1;transform:translate(0.0px,102px)}30.0%{opacity:1;transform:translate(0.0px,102px)}34.0%{opacity:1;transform:translate(0.0px,42px)}44.0%{opacity:1;transform:translate(340.0px,42px)}48.0%{opacity:1;transform:translate(340.0px,102px)}56.0%{opacity:1;transform:translate(340.0px,102px)}59.0%{opacity:1;transform:translate(340.0px,42px)}62.0%{opacity:1;transform:translate(510.0px,42px)}66.0%{opacity:1;transform:translate(510.0px,102px)}80.0%{opacity:1;transform:translate(510.0px,102px)}82.5%,100%{opacity:0;transform:translate(510.0px,102px)}}.k5{animation-name:k5}@keyframes k6{0%,8.0%{opacity:0}12.0%,91.0%{opacity:1}97.0%,100%{opacity:0}}.k6{animation-name:k6}@keyframes k7{0%,26.0%{opacity:0}30.0%,91.0%{opacity:1}97.0%,100%{opacity:0}}.k7{animation-name:k7}@keyframes k8{0%,46.0%{opacity:0}50.0%,91.0%{opacity:1}97.0%,100%{opacity:0}}.k8{animation-name:k8}@keyframes k9{0%,64.0%{opacity:0}68.0%,91.0%{opacity:1}97.0%,100%{opacity:0}}.k9{animation-name:k9}@media (prefers-reduced-motion:reduce){.an{animation:none!important}}</style><rect width="920" height="500" rx="16" fill="#0b1220"/><rect x="0.5" y="0.5" width="919" height="499" rx="15.5" fill="none" stroke="#2b3b58"/><text x="28" y="38" class="h">TWO LAYERS, ONE SYSTEM</text><rect x="28" y="58" width="864" height="168" rx="12" fill="#111c30"/><text x="46" y="82" class="h">AGENT FRAMEWORK  (clawft)</text><rect x="46" y="100" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="46" y="110" width="3" height="80" rx="1.5" fill="#5b9dff"/><text x="62" y="128" class="t">weft</text><text x="62" y="150" class="s">agent CLI</text><rect x="216" y="100" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="216" y="110" width="3" height="80" rx="1.5" fill="#5b9dff"/><text x="232" y="128" class="t">Providers</text><text x="232" y="150" class="s">LLM backends</text><rect x="386" y="100" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="386" y="110" width="3" height="80" rx="1.5" fill="#5b9dff"/><text x="402" y="128" class="t">Channels</text><text x="402" y="150" class="s">where messages arrive</text><rect x="556" y="100" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="556" y="110" width="3" height="80" rx="1.5" fill="#5b9dff"/><text x="572" y="128" class="t">Tools</text><text x="572" y="150" class="s">what an agent can call</text><rect x="726" y="100" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="726" y="110" width="3" height="80" rx="1.5" fill="#5b9dff"/><text x="742" y="128" class="t">Skills</text><text x="742" y="150" class="s">reusable know-how</text><rect x="28" y="266" width="864" height="168" rx="12" fill="#111c30"/><text x="46" y="290" class="h">COGNITIVE OS  (the kernel, operated with weaver)</text><rect x="46" y="308" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="46" y="318" width="3" height="80" rx="1.5" fill="#2dd4bf"/><text x="62" y="336" class="t">Process table</text><text x="62" y="358" class="s">agents run as PIDs</text><rect x="216" y="308" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="216" y="318" width="3" height="80" rx="1.5" fill="#2dd4bf"/><text x="232" y="336" class="t">Typed IPC</text><text x="232" y="358" class="s">agent messaging</text><rect x="386" y="308" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="386" y="318" width="3" height="80" rx="1.5" fill="#fbbf24"/><text x="402" y="336" class="t">Governance</text><text x="402" y="358" class="s">decides each action</text><rect x="556" y="308" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="556" y="318" width="3" height="80" rx="1.5" fill="#a78bfa"/><text x="572" y="336" class="t">ExoChain</text><text x="572" y="358" class="s">append-only audit</text><rect x="726" y="308" width="150" height="100" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="726" y="318" width="3" height="80" rx="1.5" fill="#2dd4bf"/><text x="742" y="336" class="t">weaver</text><text x="742" y="358" class="s">operator CLI</text><path d="M121.0 226 V246 H631.0 V266" fill="none" stroke="#2b3b58" stroke-width="2" stroke-dasharray="4 5"/><g class="an k1 hid"><rect x="44" y="98" width="154" height="104" rx="12" fill="none" stroke="#5b9dff" stroke-width="2.5"/></g><g class="an k2 hid"><rect x="44" y="306" width="154" height="104" rx="12" fill="none" stroke="#2dd4bf" stroke-width="2.5"/></g><g class="an k3 hid"><rect x="384" y="306" width="154" height="104" rx="12" fill="none" stroke="#fbbf24" stroke-width="2.5"/></g><g class="an k4 hid"><rect x="554" y="306" width="154" height="104" rx="12" fill="none" stroke="#a78bfa" stroke-width="2.5"/></g><g class="an k5 hid"><circle cx="121.0" cy="204" r="6" fill="#eaf0f8"/><circle cx="121.0" cy="204" r="11" fill="#eaf0f8" opacity=".18"/></g><g class="an k6"><circle cx="56" cy="462" r="10" fill="#5b9dff"/><text x="56" y="466" text-anchor="middle" class="bn">1</text><text x="74" y="460" class="cap">weft agent -m "..."</text><text x="74" y="478" class="s">a message enters</text></g><g class="an k7"><circle cx="270" cy="462" r="10" fill="#2dd4bf"/><text x="270" y="466" text-anchor="middle" class="bn">2</text><text x="288" y="460" class="cap">agent runs as a process</text><text x="288" y="478" class="s">in the kernel</text></g><g class="an k8"><circle cx="484" cy="462" r="10" fill="#fbbf24"/><text x="484" y="466" text-anchor="middle" class="bn">3</text><text x="502" y="460" class="cap">governance decides</text><text x="502" y="478" class="s">permit or deny</text></g><g class="an k9"><circle cx="698" cy="462" r="10" fill="#a78bfa"/><text x="698" y="466" text-anchor="middle" class="bn">4</text><text x="716" y="460" class="cap">ExoChain records it</text><text x="716" y="478" class="s">append-only</text></g></svg>
