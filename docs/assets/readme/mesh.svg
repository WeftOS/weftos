<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d"><title id="t">The mesh: admit, expose, route</title><desc id="d">Two nodes connect over an encrypted Noise link, then prove identity with a signed AdmitHello. Node A exposes a topic to paired peers and Node B receives it; a node that was not admitted is refused; weaver expose off withdraws the topic at once. Below, the tailnet router gives one development machine a single HTTPS front door that routes by path prefix to each project's own port.</desc><style>text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.t{font-size:15px;font-weight:600;fill:#eaf0f8}.tb{font-size:17px;font-weight:700;fill:#eaf0f8}.s{font-size:13px;fill:#9fb0c8}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#8fd3ff}.h{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#9fb0c8}.bn{font-size:12px;font-weight:700;fill:#0b1220}.cap{font-size:13px;fill:#eaf0f8}.hid{opacity:0}.an{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}@keyframes k1{0%,0.0%{opacity:0}0.08%,60.0%{opacity:1}65.0%,100%{opacity:0}}.k1{animation-name:k1}@keyframes k2{0%,60.0%{opacity:0}62.5%,92.5%{opacity:1}97.5%,100%{opacity:0}}.k2{animation-name:k2}@keyframes k3{0%,8.33%{opacity:0}11.67%,92.5%{opacity:1}97.5%,100%{opacity:0}}.k3{animation-name:k3}@keyframes k4{0%,8.33%{opacity:0}11.67%,92.5%{opacity:1}97.5%,100%{opacity:0}}.k4{animation-name:k4}@keyframes k5{0%,20.0%{opacity:0}23.33%,92.5%{opacity:1}97.5%,100%{opacity:0}}.k5{animation-name:k5}@keyframes k6{0%,33.33%{opacity:0;transform:translate(0,0)}34.58%{opacity:1;transform:translate(0,0)}43.33%{opacity:1;transform:translate(396px,0px)}44.58%,100%{opacity:0;transform:translate(396px,0px)}}.k6{animation-name:k6}@keyframes k7{0%,40.83%{opacity:0;transform:translate(0,0)}42.08%{opacity:1;transform:translate(0,0)}50.83%{opacity:1;transform:translate(396px,0px)}52.08%,100%{opacity:0;transform:translate(396px,0px)}}.k7{animation-name:k7}@keyframes k8{0%,48.33%{opacity:0;transform:translate(0,0)}49.58%{opacity:1;transform:translate(0,0)}58.33%{opacity:1;transform:translate(396px,0px)}59.58%,100%{opacity:0;transform:translate(396px,0px)}}.k8{animation-name:k8}@keyframes k9{0%,33.33%{opacity:0}36.67%,60.0%{opacity:1}65.0%,100%{opacity:0}}.k9{animation-name:k9}@keyframes k10{0%,61.67%{opacity:0}65.0%,92.5%{opacity:1}97.5%,100%{opacity:0}}.k10{animation-name:k10}@keyframes k11{0%,41.67%{opacity:0}44.58%{opacity:1}60.0%,100%{opacity:0}}.k11{animation-name:k11}@keyframes k12{0%,58.33%{opacity:0;transform:translate(0,0)}60.0%{opacity:1;transform:translate(0,0)}68.33%{opacity:1;transform:translate(158px,0px)}78.33%{opacity:1;transform:translate(364px,0px)}85.0%{opacity:1;transform:translate(556px,0px)}88.33%{opacity:1;transform:translate(556px,-48px)}91.67%{opacity:1;transform:translate(584px,-48px)}93.33%,100%{opacity:0;transform:translate(584px,-48px)}}.k12{animation-name:k12}@media (prefers-reduced-motion:reduce){.an{animation:none!important}}</style><rect width="960" height="640" rx="16" fill="#0b1220"/><rect x="0.5" y="0.5" width="959" height="639" rx="15.5" fill="none" stroke="#2b3b58"/><text x="28" y="38" class="h">THE MESH: ADMIT, EXPOSE, ROUTE</text><rect x="28" y="56" width="904" height="300" rx="12" fill="#111c30"/><rect x="46" y="96" width="230" height="164" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="46" y="106" width="3" height="144" rx="1.5" fill="#2dd4bf"/><text x="62" y="124" class="t">Node A</text><text x="62" y="146" class="s">writes a topic</text><rect x="684" y="96" width="230" height="164" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="684" y="106" width="3" height="144" rx="1.5" fill="#2dd4bf"/><text x="700" y="124" class="t">Node B</text><text x="700" y="146" class="s">subscribes, inside the</text><text x="700" y="164" class="s">audience the operator set</text><rect x="60" y="172" width="202" height="26" rx="6" fill="#0b1220" stroke="#2b3b58"/><text x="68" y="189" class="m" style="font-size:11px">topic.vision.detections/cam-0</text><text x="62" y="226" class="s">audience: paired</text><g class="an k1"><rect x="196" y="213" width="44" height="22" rx="11" fill="#4ade80"/><circle cx="229" cy="224" r="8" fill="#0b1220"/></g><g class="an k2 hid"><rect x="196" y="213" width="44" height="22" rx="11" fill="#f87171"/><circle cx="207" cy="224" r="8" fill="#0b1220"/></g><path d="M276 184 H684" stroke="#2b3b58" stroke-width="2" stroke-dasharray="3 6"/><g class="an k3"><path d="M276 184 H684" stroke="#5b9dff" stroke-width="2.5"/></g><g class="an k4"><text x="480.0" y="148" text-anchor="middle" class="t">Noise XX: encrypted link</text></g><g class="an k5"><text x="480.0" y="168" text-anchor="middle" class="s">AdmitHello signs the handshake hash: admitted</text></g><g class="an k6 hid"><rect x="277" y="179" width="12" height="10" rx="3" fill="#fbbf24"/></g><g class="an k7 hid"><rect x="277" y="179" width="12" height="10" rx="3" fill="#fbbf24"/></g><g class="an k8 hid"><rect x="277" y="179" width="12" height="10" rx="3" fill="#fbbf24"/></g><g class="an k9"><text x="480.0" y="212" text-anchor="middle" class="s">TopicData, credit-based</text></g><g class="an k10 hid"><text x="480.0" y="212" text-anchor="middle" class="t" style="fill:#f87171">expose off: subscription ends</text></g><rect x="375.0" y="248" width="210" height="48" rx="10" fill="#0b1220" stroke="#2b3b58" stroke-dasharray="5 4"/><text x="480.0" y="269" text-anchor="middle" class="t">Node C</text><text x="480.0" y="286" text-anchor="middle" class="s">not admitted</text><path d="M480.0 248 V224" stroke="#2b3b58" stroke-width="2" stroke-dasharray="3 5"/><g class="an k11 hid"><path d="M472.0 230 l16 16 M488.0 230 l-16 16" stroke="#f87171" stroke-width="3" stroke-linecap="round"/><text x="502.0" y="244" class="s" style="fill:#f87171">refused</text></g><text x="48" y="338" class="s">Admission modes: off, observe (default), enforce. A topic is served only if the writing cog declared mesh limits and the audience covers the peer.</text><rect x="28" y="376" width="904" height="236" rx="12" fill="#111c30"/><text x="46" y="400" class="h">TAILNET ROUTER: ONE HTTPS FRONT DOOR PER DEVELOPMENT MACHINE</text><rect x="46" y="424" width="150" height="84" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="46" y="434" width="3" height="64" rx="1.5" fill="#5b9dff"/><text x="62" y="452" class="t">Browser</text><text x="62" y="474" class="s">on your tailnet</text><rect x="232" y="424" width="168" height="84" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="232" y="434" width="3" height="64" rx="1.5" fill="#5b9dff"/><text x="248" y="452" class="t">Tailscale Serve</text><text x="248" y="474" class="s">TLS on :443</text><rect x="436" y="424" width="150" height="84" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="436" y="434" width="3" height="64" rx="1.5" fill="#5b9dff"/><text x="452" y="452" class="t">Router</text><text x="452" y="474" class="s">loopback, by prefix</text><rect x="640" y="424" width="270" height="40" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="640" y="434" width="3" height="20" rx="1.5" fill="#2dd4bf"/><text x="656" y="452" class="t">/myapp  to  :18120</text><rect x="640" y="472" width="270" height="40" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="640" y="482" width="3" height="20" rx="1.5" fill="#2dd4bf"/><text x="656" y="500" class="t">/_weftos/  to  route index</text><path d="M196 492 H232" stroke="#2b3b58" stroke-width="2"/><path d="M400 492 H436" stroke="#2b3b58" stroke-width="2"/><path d="M586 492 H612 V444 H640 M612 492 H640" fill="none" stroke="#2b3b58" stroke-width="2"/><g class="an k12 hid"><circle cx="56" cy="492" r="5" fill="#fbbf24"/></g><text x="46" y="548" class="m">https://&lt;machine&gt;.&lt;tailnet&gt;.ts.net/myapp/</text><text x="46" y="574" class="s">Routes live in each project's compose/ports.yaml. Tailnet only: Funnel is never enabled. Per-route allowlists use Tailscale identity.</text><text x="46" y="594" class="s">The route index at /_weftos/ lists every route with its health.</text></svg>
