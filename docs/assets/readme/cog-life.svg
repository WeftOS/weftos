<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 384" width="1000" height="384" role="img" aria-labelledby="t d"><title id="t">A cog's life</title><desc id="d">A cog is a signed release, verified against a pinned key, placed on a node by governed placement, run by the node's Cog Host, publishing readings, streams and blobs on cogbus, and optionally exposed as a mesh topic with an audience the operator chooses. An unsigned or wrongly signed cog is refused.</desc><style>text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.t{font-size:15px;font-weight:600;fill:#eaf0f8}.tb{font-size:17px;font-weight:700;fill:#eaf0f8}.s{font-size:13px;fill:#9fb0c8}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#8fd3ff}.h{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#9fb0c8}.bn{font-size:12px;font-weight:700;fill:#0b1220}.cap{font-size:13px;fill:#eaf0f8}.hid{opacity:0}.an{animation-duration:11s;animation-iteration-count:infinite;animation-timing-function:linear;animation-fill-mode:both}@keyframes k1{0%,7.27%{opacity:0}10.45%{opacity:1}25.45%,100%{opacity:0}}.k1{animation-name:k1}@keyframes k2{0%,20.0%{opacity:0}23.18%{opacity:1}38.18%,100%{opacity:0}}.k2{animation-name:k2}@keyframes k3{0%,32.73%{opacity:0}35.91%{opacity:1}50.91%,100%{opacity:0}}.k3{animation-name:k3}@keyframes k4{0%,45.45%{opacity:0}48.64%{opacity:1}63.64%,100%{opacity:0}}.k4{animation-name:k4}@keyframes k5{0%,58.18%{opacity:0}61.36%{opacity:1}76.36%,100%{opacity:0}}.k5{animation-name:k5}@keyframes k6{0%,70.91%{opacity:0}74.09%{opacity:1}89.09%,100%{opacity:0}}.k6{animation-name:k6}@keyframes k7{0%,7.27%{opacity:0;transform:translate(0,0)}9.55%{opacity:1;transform:translate(0,0)}20.0%{opacity:1;transform:translate(164.0px,0px)}32.73%{opacity:1;transform:translate(328.0px,0px)}45.45%{opacity:1;transform:translate(492.0px,0px)}58.18%{opacity:1;transform:translate(656.0px,0px)}70.91%{opacity:1;transform:translate(820.0px,0px)}77.27%{opacity:1;transform:translate(820.0px,0px)}79.55%,100%{opacity:0;transform:translate(820.0px,0px)}}.k7{animation-name:k7}@keyframes k8{0%,21.82%{opacity:0}25.45%,72.73%{opacity:1}78.18%,100%{opacity:0}}.k8{animation-name:k8}@keyframes k9{0%,43.64%{opacity:0}47.27%,91.82%{opacity:1}97.27%,100%{opacity:0}}.k9{animation-name:k9}@keyframes k10{0%,72.73%{opacity:0}76.36%,91.82%{opacity:1}97.27%,100%{opacity:0}}.k10{animation-name:k10}@keyframes k11{0%,83.64%{opacity:0}87.27%,91.82%{opacity:1}97.27%,100%{opacity:0}}.k11{animation-name:k11}@media (prefers-reduced-motion:reduce){.an{animation:none!important}}</style><rect width="1000" height="384" rx="16" fill="#0b1220"/><rect x="0.5" y="0.5" width="999" height="383" rx="15.5" fill="none" stroke="#2b3b58"/><text x="28" y="38" class="h">A COG'S LIFE, FROM SIGNED RELEASE TO MESH TOPIC</text><rect x="24" y="96" width="150" height="116" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="24" y="106" width="3" height="96" rx="1.5" fill="#5b9dff"/><circle cx="46" cy="119" r="10" fill="#5b9dff"/><text x="46" y="123" text-anchor="middle" class="bn">1</text><text x="64" y="124" class="t">Signed release</text><text x="40" y="146" class="s">Ed25519 signature,</text><text x="40" y="164" class="s">per-arch binary,</text><text x="40" y="182" class="s">cog.toml manifest</text><path d="M99.0 79 V96" stroke="#2b3b58" stroke-width="2"/><rect x="188" y="96" width="150" height="116" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="188" y="106" width="3" height="96" rx="1.5" fill="#4ade80"/><circle cx="210" cy="119" r="10" fill="#4ade80"/><text x="210" y="123" text-anchor="middle" class="bn">2</text><text x="228" y="124" class="t">Verify</text><text x="204" y="146" class="s">checked against</text><text x="204" y="164" class="s">the pinned key</text><text x="204" y="182" class="s">before any trust</text><path d="M263.0 79 V96" stroke="#2b3b58" stroke-width="2"/><rect x="352" y="96" width="150" height="116" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="352" y="106" width="3" height="96" rx="1.5" fill="#fbbf24"/><circle cx="374" cy="119" r="10" fill="#fbbf24"/><text x="374" y="123" text-anchor="middle" class="bn">3</text><text x="392" y="124" class="t">Placement</text><text x="368" y="146" class="s">constraints, then</text><text x="368" y="164" class="s">scoring; a permit</text><text x="368" y="182" class="s">for workload.place</text><path d="M427.0 79 V96" stroke="#2b3b58" stroke-width="2"/><rect x="516" y="96" width="150" height="116" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="516" y="106" width="3" height="96" rx="1.5" fill="#2dd4bf"/><circle cx="538" cy="119" r="10" fill="#2dd4bf"/><text x="538" y="123" text-anchor="middle" class="bn">4</text><text x="556" y="124" class="t">Node runs it</text><text x="532" y="146" class="s">Cog Host supervises;</text><text x="532" y="164" class="s">native needs trust</text><text x="532" y="182" class="s">tier paired or up</text><path d="M591.0 79 V96" stroke="#2b3b58" stroke-width="2"/><rect x="680" y="96" width="150" height="116" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="680" y="106" width="3" height="96" rx="1.5" fill="#a78bfa"/><circle cx="702" cy="119" r="10" fill="#a78bfa"/><text x="702" y="123" text-anchor="middle" class="bn">5</text><text x="720" y="124" class="t">Cogbus</text><text x="696" y="146" class="s">reading: a message</text><text x="696" y="164" class="s">stream: shm ring</text><text x="696" y="182" class="s">blob: fetched by hash</text><path d="M755.0 79 V96" stroke="#2b3b58" stroke-width="2"/><rect x="844" y="96" width="150" height="116" rx="10" fill="#1a2740" stroke="#2b3b58"/><rect x="844" y="106" width="3" height="96" rx="1.5" fill="#5b9dff"/><circle cx="866" cy="119" r="10" fill="#5b9dff"/><text x="866" y="123" text-anchor="middle" class="bn">6</text><text x="884" y="124" class="t">Mesh topic</text><text x="860" y="146" class="s">exposed? default is</text><text x="860" y="164" class="s">local only; operator</text><text x="860" y="182" class="s">widens, can kill it</text><path d="M919.0 79 V96" stroke="#2b3b58" stroke-width="2"/><path d="M99.0 72 H919.0" stroke="#2b3b58" stroke-width="2"/><circle cx="99.0" cy="72" r="7" fill="#0b1220" stroke="#5b9dff" stroke-width="2"/><g class="an k1 hid"><circle cx="99.0" cy="72" r="7" fill="#5b9dff"/><rect x="22.0" y="94" width="154" height="120" rx="12" fill="none" stroke="#5b9dff" stroke-width="2.5"/></g><circle cx="263.0" cy="72" r="7" fill="#0b1220" stroke="#4ade80" stroke-width="2"/><g class="an k2 hid"><circle cx="263.0" cy="72" r="7" fill="#4ade80"/><rect x="186.0" y="94" width="154" height="120" rx="12" fill="none" stroke="#4ade80" stroke-width="2.5"/></g><circle cx="427.0" cy="72" r="7" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><g class="an k3 hid"><circle cx="427.0" cy="72" r="7" fill="#fbbf24"/><rect x="350.0" y="94" width="154" height="120" rx="12" fill="none" stroke="#fbbf24" stroke-width="2.5"/></g><circle cx="591.0" cy="72" r="7" fill="#0b1220" stroke="#2dd4bf" stroke-width="2"/><g class="an k4 hid"><circle cx="591.0" cy="72" r="7" fill="#2dd4bf"/><rect x="514.0" y="94" width="154" height="120" rx="12" fill="none" stroke="#2dd4bf" stroke-width="2.5"/></g><circle cx="755.0" cy="72" r="7" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><g class="an k5 hid"><circle cx="755.0" cy="72" r="7" fill="#a78bfa"/><rect x="678.0" y="94" width="154" height="120" rx="12" fill="none" stroke="#a78bfa" stroke-width="2.5"/></g><circle cx="919.0" cy="72" r="7" fill="#0b1220" stroke="#5b9dff" stroke-width="2"/><g class="an k6 hid"><circle cx="919.0" cy="72" r="7" fill="#5b9dff"/><rect x="842.0" y="94" width="154" height="120" rx="12" fill="none" stroke="#5b9dff" stroke-width="2.5"/></g><g class="an k7 hid"><circle cx="99.0" cy="72" r="5" fill="#eaf0f8"/><circle cx="99.0" cy="72" r="10" fill="#eaf0f8" opacity=".18"/></g><g class="an k8"><path d="M263.0 236 V238" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4"/><rect x="178.0" y="238" width="170" height="50" rx="10" fill="#0b1220" stroke="#f87171" stroke-dasharray="5 4"/><text x="263.0" y="259" text-anchor="middle" class="t" fill="#f87171" style="fill:#f87171">Refused</text><text x="263.0" y="277" text-anchor="middle" class="s">unknown or bad signer</text></g><g class="an k9"><path d="M427.0 236 V238 M591.0 236 V238" stroke="#a78bfa" stroke-width="2"/><rect x="352.0" y="238" width="314.0" height="50" rx="10" fill="#0b1220" stroke="#a78bfa"/><text x="509.0" y="259" text-anchor="middle" class="t">Every decision is an ExoChain event</text><text x="509.0" y="277" text-anchor="middle" class="s">placement, refusal, start, stop, revoke</text></g><g class="an k10"><path d="M919.0 236 V238" stroke="#5b9dff" stroke-width="2"/><rect x="801.0" y="238" width="194" height="50" rx="10" fill="#0b1220" stroke="#5b9dff"/><text x="898.0" y="259" text-anchor="middle" class="m">weaver expose off ID</text><text x="898.0" y="277" text-anchor="middle" class="s">withdrawn at once</text></g><g class="an k11"><text x="24" y="332" class="s">Revocation by package, signer key or artifact hash stops and unloads the cog on every node that holds it.</text></g><text x="24" y="358" class="s">The appliance path (weaver cog install) verifies and runs a binary but is not a governed placement.</text></svg>
