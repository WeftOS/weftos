[package]
name = "clawft-cow-memory"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Branchable, checkpointable memory over rvf-runtime::RvfStore (agenticow semantics, ported to Rust)."
readme = "README.md"

[dependencies]
rvf-runtime = { version = "0.5", default-features = false, features = ["std"] }
rvf-types = { package = "rvf-types", version = "0.3", default-features = false, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
