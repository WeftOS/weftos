[package]
name = "weftos-room-scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Room scope: overhead-camera frames with a room grid, a tracked person and per-node CSI deviation overlays, read from a private data directory (native egui)"

[lib]
name = "weftos_room_scope"
path = "src/lib.rs"

[[bin]]
name = "weft-room-scope"
path = "src/main.rs"

[dependencies]
egui_plot = "0.35"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
