[package]
name = "clawft-tools"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tool implementations for clawft (file, shell, memory)"
readme = "README.md"
keywords = ["tools", "shell", "file", "memory", "security"]
categories = ["development-tools"]

[features]
default = ["native-exec", "native", "subagent"]
native-exec = []
native = [
    "dep:tokio",
    "clawft-platform/native",
    "clawft-core/native",
    "clawft-types/native",
]
# M4 agent-initiated-work tools (agent_spawn / task_status / task_result /
# agent_message). Requires `native` — the `SubagentSpawner` seam and its
# `spawn_context` task-local are native/daemon-only. Off for browser/WASM.
subagent = ["native"]
browser = [
    "clawft-platform/browser",
    "clawft-core/browser",
]
# WEFT-392: OPFS-backed platform filesystem for browser tools.
browser-opfs = ["browser", "clawft-platform/browser-opfs"]
canvas = []
vector-memory = ["clawft-core/vector-memory"]
delegate = ["clawft-services/delegate"]
# WEFT-214 / WEFT-671: live stack (clawft-channels STT/TTS), not plugin scaffold.
# WEFT-233: multi-format audio decode via symphonia (WAV/MP3/OGG/WebM).
voice = [
    "dep:clawft-channels",
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-util",
    "dep:symphonia",
]

[dependencies]
clawft-types = { workspace = true, default-features = false }
clawft-platform = { workspace = true, default-features = false }
clawft-core = { workspace = true, default-features = false }
clawft-services = { workspace = true, optional = true }
# Live voice stack for voice_listen / voice_speak (WEFT-214).
clawft-channels = { workspace = true, optional = true, features = ["voice"] }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
ipnet = "2"

# Native only
tokio = { workspace = true, optional = true }
# Voice STT/TTS HTTP (substrate + OpenAI cloud fallback).
reqwest = { workspace = true, optional = true, features = ["json", "multipart", "rustls-tls"] }
tokio-util = { workspace = true, optional = true }
# WEFT-233: decode MP3/OGG/WebM (+ WAV) for audio_transcribe.
symphonia = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
# WEFT-224 SC-3: capture transparency log lines in unit tests.
tracing-subscriber = { workspace = true, features = ["registry"] }
# WEFT-349: specialist profile load from temp agents/ tree.
tempfile = { workspace = true }
