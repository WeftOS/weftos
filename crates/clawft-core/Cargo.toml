[package]
name = "clawft-core"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core engine for clawft (agent loop, message bus, context management)"
readme = "README.md"
keywords = ["ai", "agent", "pipeline", "tools", "llm"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["full", "native"]
full = ["rvf", "signing", "vector-memory", "embedding-router"]
native = [
    "dep:notify",
    "dep:dirs",
    "dep:tokio",
    "dep:tokio-util",
    "dep:clawft-service-llm",
    "real-tokenizer",
    "clawft-platform/native",
    "clawft-llm/native",
    "clawft-plugin/native",
    "clawft-types/native",
]
# ADR-058 Phase 2.1: use a real BPE tokenizer (tiktoken o200k_base) for
# context-window budgeting instead of the whitespace heuristic. Native
# implies it; browser/WASM builds omit it and fall back to the char/word
# estimator in `agent::tokenizer`.
real-tokenizer = ["dep:tiktoken-rs", "dep:tokenizers"]
browser = [
    "clawft-platform/browser",
    "clawft-llm/browser",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:futures-channel",
]
vector-memory = ["dep:rand", "dep:instant-distance"]
rvf = ["vector-memory", "dep:rvf-runtime", "dep:rvf-types", "dep:reqwest", "dep:clawft-cow-memory"]
signing = ["dep:ed25519-dalek", "dep:rand"]
# agent-core-v1 Phase E2: enables EmbeddingRouter's production index
# backed by ruvector-diskann@2.1 (Vamana + PQ + mmap). When the feature
# is off, the router falls back to an in-memory brute-force cosine
# index (still O(n) over ~35 skills — measured under a microsecond).
# Implies vector-memory because the Embedder trait lives there.
embedding-router = ["vector-memory", "dep:ruvector-diskann"]
# WEFT-46 / agent-core-v1 Phase E3+: sona-backed skill rerank step on
# HybridRouter. Opt-in only — keeps default/`full` builds free of the
# upstream `ruvector-sona` dep so a slow or broken release cannot block
# the gate. Enable with `--features hybrid-rerank`.
hybrid-rerank = ["dep:ruvector-sona"]

[dependencies]
# Always available
clawft-types = { workspace = true, default-features = false }
clawft-platform = { workspace = true, default-features = false }
clawft-llm = { workspace = true, default-features = false }
clawft-plugin = { workspace = true, default-features = false }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde_yaml = { workspace = true }
# WEFT-349: agent profiles may be agents/<name>.toml / agent.toml
toml = { workspace = true }
futures-util = { workspace = true }
percent-encoding = "2"
fnv = "1"

# Native only
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
# clawft-service-llm provides the narrow LlmClient that talks to a
# local llama-server over OpenAI-compat HTTP. The pipeline's
# ServiceLlmAdapter (`pipeline/service_llm_adapter.rs`) bridges
# LlmClient into the pipeline's LlmProvider trait so the agent loop
# routes through the same service the daemon's `llm.prompt` RPC uses.
# Native-only because LlmClient pulls reqwest.
clawft-service-llm = { workspace = true, optional = true }

# Browser only
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
futures-channel = { version = "0.3", optional = true }

# Optional across both
rand = { workspace = true, optional = true }
instant-distance = { workspace = true, optional = true }
# Real subword tokenizer for context budgeting (ADR-058 Phase 2.1). Native
# only — the bundled BPE vocab is heavy and the browser build falls back to
# the char/word heuristic in `agent::tokenizer`.
tiktoken-rs = { workspace = true, optional = true }
# Exact tokenizer of the served model. The agent loop's Hermes-4.3-36B is a
# Seed-OSS (155k-vocab) model whose `tokenizer.json` is the ground truth for
# context-window budgeting. Loaded at runtime via `CLAWFT_HERMES_TOKENIZER`
# (see `agent::tokenizer`); o200k_base stays the bundled, download-free
# stand-in when no exact tokenizer is configured.
tokenizers = { workspace = true, optional = true }
rvf-runtime = { workspace = true, optional = true }
rvf-types = { workspace = true, optional = true }
# WEFT-616 Phase 2: per-turn COW memory checkpointing (BranchableMemory).
# No clawft-* deps of its own; safe in the clawft-core -> clawft-cow-memory
# direction. Gated behind `rvf` since it links rvf-runtime.
clawft-cow-memory = { workspace = true, optional = true }
# E2 EmbeddingRouter: workspace-pinned at 2.1 (Cargo.toml:176). Vamana
# graph + PQ + mmap; same crate the kernel uses in vector_diskann.rs.
ruvector-diskann = { workspace = true, optional = true }
# WEFT-46: SONA (Self-Optimizing Neural Architecture) for HybridRouter
# skill rerank. Optional; only linked when `hybrid-rerank` is enabled.
ruvector-sona = { workspace = true, optional = true }
# sha2 is always-on so identity hashing (Phase D1 of agent-core-v1)
# works without enabling rvf / signing. Existing rvf / signing
# features still depend on it transitively (was previously optional).
sha2 = { workspace = true }
# WEFT-28: HMAC-SHA256 over the cost-tracker persistence file.
hmac = { workspace = true }
reqwest = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
dashmap = "6"
tokio = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clawft-platform = { workspace = true }
clawft-types = { workspace = true }
temp-env = "0.3"
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
rand = { workspace = true }
# ServiceLlmAdapter integration tests spin up a wiremock server to
# stand in for llama-server's `/v1/chat/completions` endpoint and
# verify the JSON conversion round-trip.
wiremock = "0.6"

# WEFT-390: browser stream path (non-Send callback). Isolated so native
# default test binaries don't need the browser feature.
[[test]]
name = "browser_stream"
path = "tests/browser_stream.rs"
required-features = ["browser"]

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "map_contention_bench"
harness = false


