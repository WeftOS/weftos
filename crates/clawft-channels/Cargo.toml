[package]
name = "clawft-channels"
version.workspace = true
# Publishable: reusable channel plugin API.
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Channel plugin system for clawft"
keywords = ["telegram", "slack", "discord", "chat", "bot"]
categories = ["network-programming"]

[features]
default = ["native"]
native = ["clawft-plugin/native"]
# Email channel: IMAP inbound (sync `imap` + native-tls via spawn_blocking)
# and SMTP outbound (`lettre` async rustls). `mailparse` decodes RFC822.
email = ["dep:imap", "dep:lettre", "dep:mailparse", "dep:native-tls"]
whatsapp = ["dep:axum", "dep:hex"]
# `signal` requires `clawft-plugin/native` for the tokio-backed
# CancellationToken. The crate's `native` feature is on by default
# (see [features].default), so this is a belt-and-suspenders
# guarantee for `cargo check -p clawft-channels --features signal`
# without --no-default-features.
signal = ["clawft-plugin/native"]
matrix = []
# Google Chat adapter: Pub/Sub pull + chat.spaces.messages.create POST.
google-chat = ["dep:base64"]
# IRC adapter: TCP/TLS dial + IRCv3 CAP/SASL + JOIN + PRIVMSG.
irc = ["dep:tokio-rustls", "dep:webpki-roots", "dep:rustls-pki-types", "dep:base64"]
# Microsoft Teams: Bot Framework OAuth2 + Graph + axum webhook + JWT.
teams = ["dep:axum", "dep:jsonwebtoken"]
# Voice channel: trait-injected audio + substrate STT/TTS HTTP. The
# default `voice` build uses fake audio sources so CI passes without
# alsa / CoreAudio / WASAPI dev headers; `voice-real-audio` opts cpal
# in; `real-audio-test` enables the cpal-touching tests too.
voice = ["dep:rustfft"]
voice-real-audio = ["voice", "dep:cpal"]
real-audio-test = ["voice-real-audio"]
# ADR-074 / WEFT-689+690: xAI Realtime WebSocket client (connect +
# session.update hello) and V1 tool bridge → WindowIntent. Requires `voice`.
voice-xai = ["voice"]
# WEFT-227: reserved for future sherpa-onnx / pyannote neural diarization
# native deps. Default builds use Fixture/EnergyGap/Embedding diarizers
# (see voice::diarization); enabling this flag today only documents intent
# — SherpaDiarizer still returns a clear "not staged" error until models land.
diarization-sherpa = ["voice"]
# WEFT-232: Discord VC bridge (VC PCM → STT → agent → TTS → VC).
# Trait-injected transport; tests use MockDiscordVcTransport (no bot token,
# no serenity/songbird). Real songbird adapter is scaffold-only until a
# dedicated optional dep lands (SONGBIRD_TRANSPORT_IMPLEMENTED = false).
discord-voice = ["voice"]

[dependencies]
clawft-types = { workspace = true }
clawft-platform = { workspace = true }
clawft-plugin = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `multipart` is voice-only (whisper.cpp /inference takes a WAV part) but
# additive on the workspace `reqwest` -- harmless for other channels.
reqwest = { workspace = true, features = ["multipart"] }
chrono = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }

# Optional, gated under feature flags. Pulled in only when the relevant
# adapter is enabled (see [features] above).
# - base64: google-chat Pub/Sub data field; irc SASL PLAIN.
# - axum + jsonwebtoken: teams Bot Framework webhook + JWT decode.
# - axum + hex: whatsapp Cloud API webhook + HMAC hex.
# - tokio-rustls / webpki-roots / rustls-pki-types: irc TLS dial.
# - cpal: voice-real-audio cpal capture/playback (opt-in).
base64 = { version = "0.22", optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "macros", "query"], optional = true }
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"], optional = true }
hex = { version = "0.4", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"], optional = true }
webpki-roots = { version = "1.0", optional = true }
rustls-pki-types = { version = "1", optional = true }
cpal = { version = "0.15", optional = true }
# Voice-only: per-frame speech-band spectral voiceness gate (VAD at low SNR).
rustfft = { workspace = true, optional = true }
# Email (feature `email`):
# - imap 2.4: sync IMAP client (run under spawn_blocking)
# - native-tls: TLS for imap connect / STARTTLS
# - lettre: async SMTP with rustls (STARTTLS + implicit TLS)
# - mailparse: RFC822 body/header decode for inbound
# `tls` feature gates `imap::connect` / `connect_starttls` (native-tls).
imap = { version = "2.4", default-features = false, features = ["tls"], optional = true }
native-tls = { version = "0.2", optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"], optional = true }
mailparse = { version = "0.15", optional = true }

[dev-dependencies]
tokio = { workspace = true }
# wiremock + mockito back HTTP-level adapter tests across adapters
# (Google Chat, Teams, WhatsApp, Matrix, Voice substrate).
wiremock = "0.6"
mockito = "1"
# Used by `whatsapp` webhook unit tests to drive the axum router
# in-process via `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
# Matrix uses tempfile for since-token persistence test;
# Voice uses tempfile for fake audio source paths.
tempfile = { workspace = true }
