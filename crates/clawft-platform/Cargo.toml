[package]
name = "clawft-platform"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Platform abstraction layer for clawft"
readme = "README.md"
keywords = ["platform", "abstraction", "wasm", "http", "filesystem"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native"]
native = ["dep:tokio", "dep:reqwest", "dep:dirs", "clawft-types/native"]
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:getrandom", "clawft-types/browser"]
# WEFT-392: Origin Private File System backend for BrowserFileSystem.
# Requires `browser`. web-sys ≥ 0.3.70 exposes stable FileSystem*Handle /
# StorageManager bindings (no `web_sys_unstable_apis` cfg needed as of 0.3.85).
# When OPFS is unavailable at runtime (non-secure context, missing API),
# BrowserFileSystem falls back to the in-memory store.
browser-opfs = ["browser"]

[dependencies]
# Always available (trait definitions)
clawft-types = { workspace = true, default-features = false }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Native only
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }

# Browser only
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# OPFS-related features are listed here so `browser-opfs` compiles against
# them; they are inert unless the OPFS code path is cfg'd in.
web-sys = { version = "0.3", optional = true, features = [
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Window",
    "WorkerGlobalScope",
    # WEFT-392 OPFS (stable in web-sys 0.3.70+)
    "Navigator",
    "WorkerNavigator",
    "StorageManager",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "FileSystemCreateWritableOptions",
    "FileSystemRemoveOptions",
    "File",
    "Blob",
    "WritableStream",
] }
js-sys = { version = "0.3", optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
