[package]
name = "clawft-voice-onnx"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native-Rust ONNX voice models for WeftOS (ECAPA speaker embedding, parakeet-tdt STT, smart-turn endpointing, Silero VAD)"
keywords = ["voice", "speaker", "stt", "onnx", "parakeet", "vad", "silero"]
categories = ["multimedia::audio"]

[features]
# Default build is weights-free: the fbank front-end + trait wiring compile and
# unit-test without ONNX Runtime or any model file. `onnx` opts into `ort` for
# real inference (mirrors clawft-kernel's `onnx-embeddings` gate).
default = []
onnx = ["dep:ort"]

[dependencies]
# The SpeakerEmbedder trait + VoiceError live in clawft-channels; this is a
# bridge crate that implements that seam without pulling cpal/llm/kernel.
clawft-channels = { workspace = true, features = ["voice"] }
async-trait = { workspace = true }
tracing = { workspace = true }
# Pure-Rust FFT for the mel-fbank front-end (always compiled + unit-tested).
rustfft = { workspace = true }
# Offline turn-comparison tool: WAV input + JSON report.
hound = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# Workspace pins ort with default-features = false; re-list the default set
# (matches clawft-kernel) so real ECAPA inference works under `onnx`.
ort = { workspace = true, optional = true, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-24",
] }


[[bin]]
name = "smart-turn-compare"
path = "src/bin/smart_turn_compare.rs"
