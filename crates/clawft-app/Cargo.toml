[package]
name = "clawft-app"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WeftOS app manifest parser, validator, and local app registry (ADR-015)"
readme = "README.md"
keywords = ["weftos", "app", "manifest", "registry"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
semver = { version = "1", features = ["serde"] }
# Drop-in SystemTime/Instant: std on native, performance.now() on wasm.
# Used for user installs + lifecycle tombstone timestamps. OOB first-boot
# seeding (WEFT-440) uses install::OOB_INSTALLED_AT and never hits this.
web-time = "1"
# Quarantine-path telemetry (WEFT-411): warn when apps.json is corrupt.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
