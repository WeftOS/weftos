[package]
name = "weftos-worldmodel-core"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LeWM world-model core traits and latent contract (no_std). WEFT-520."
readme = "README.md"
keywords = ["weftos", "lewm", "world-model", "jepa", "no-std"]
