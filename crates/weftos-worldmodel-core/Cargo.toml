[dependencies]
# Pure traits + fixed-size latent contract — zero deps.
# Wire serde / candle live in weftos-worldmodel-impls and sensor-pipeline-wire.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
