[package]
name = "weftos-worldmodel"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LeWM latent world-model facade: re-exports core traits + default impls (single entrypoint for consumers). WEFT-522."
readme = "README.md"
keywords = ["weftos", "lewm", "world-model", "jepa", "facade"]
categories = ["science", "algorithms"]

[features]
default = []
# Optional host-side marker (crate is no_std + alloc by default).
# Enables JSON attestation encode/decode for ExoChain (WEFT-533).
std = [
    "weftos-worldmodel-core/std",
    "weftos-worldmodel-impls/std",
    "dep:serde",
    "dep:serde_json",
]
# Forward the candle ViT-tiny encoder + AdaLN pred_phi from impls (candle 0.11,
# CPU) and DefaultWorldModel::with_adaln. Default CI never enables this.
candle = ["weftos-worldmodel-impls/candle", "std"]
# Forward the Metal GPU path of the candle models (macOS, opt-in; implies candle).
metal = ["weftos-worldmodel-impls/metal", "candle"]
# ServiceApi-shaped LatticeApi facade (WEFT-527). Pulls serde_json; implies std.
service-api = ["std", "dep:serde_json"]

[dependencies]
weftos-worldmodel-core = { workspace = true, default-features = false }
weftos-worldmodel-impls = { workspace = true, default-features = false }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
weftos-worldmodel-core = { workspace = true, default-features = false }
weftos-worldmodel-impls = { workspace = true, default-features = false }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = false
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]
