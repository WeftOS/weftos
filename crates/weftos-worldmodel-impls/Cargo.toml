[package]
name = "weftos-worldmodel-impls"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LeWM world-model trait implementations (linear action-conditioned pred_phi by default; optional candle ViT-tiny encoder + AdaLN predictor). WEFT-521."
keywords = ["weftos", "lewm", "world-model", "jepa", "candle"]
categories = ["science", "algorithms"]

[features]
default = []
# Optional host marker (crate is no_std + alloc by default for stub path).
std = ["weftos-worldmodel-core/std"]
# Candle ViT-tiny encoder + AdaLN predictor (CPU), safetensors I/O and AdamW
# training (plan W5). Builds and tests on candle-core / candle-nn 0.11.1.
# Default builds never pull candle; CI stays on the default feature set.
candle = ["dep:candle-core", "dep:candle-nn", "std"]

[dependencies]
weftos-worldmodel-core = { workspace = true, default-features = false }

# Optional ML stack — only resolved when `candle` feature is enabled.
candle-core = { version = "0.11", optional = true, default-features = false }
candle-nn = { version = "0.11", optional = true, default-features = false }

[[bench]]
name = "encode_predict"
harness = false
required-features = ["candle"]

[dev-dependencies]
weftos-worldmodel-core = { workspace = true, default-features = false }

[package.metadata.docs.rs]
all-features = false
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]
