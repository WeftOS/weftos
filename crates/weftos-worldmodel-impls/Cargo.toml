[package]
name = "weftos-worldmodel-impls"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LeWM world-model trait implementations (null/stub default; optional candle ViT-tiny + AdaLN skeleton). WEFT-521."
keywords = ["weftos", "lewm", "world-model", "jepa", "candle"]
categories = ["science", "algorithms"]

[features]
default = []
# Optional host marker (crate is no_std + alloc by default for stub path).
std = ["weftos-worldmodel-core/std"]
# Candle-backed ViT-tiny encoder + AdaLN predictor skeleton.
# Default builds never pull candle (weights + training remain follow-up —
# see crate README). Enabling this feature requires a toolchain-compatible
# candle line; historical candle-core 0.2.x is known broken on this workspace
# (WEFT-216). Skeleton compiles module layout + Unavailable fallbacks.
candle = ["dep:candle-core", "dep:candle-nn", "std"]

[dependencies]
weftos-worldmodel-core = { workspace = true, default-features = false }

# Optional ML stack — only resolved when `candle` feature is enabled.
candle-core = { version = "0.11", optional = true, default-features = false }
candle-nn = { version = "0.11", optional = true, default-features = false }

[dev-dependencies]
weftos-worldmodel-core = { workspace = true, default-features = false }

[package.metadata.docs.rs]
all-features = false
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]
