[package]
name = "clawft-plugin"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Plugin trait definitions for clawft"
readme = "README.md"
keywords = ["plugin", "traits", "ai", "agent", "extensibility"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native"]
native = ["dep:tokio-util"]
# Voice umbrella: pulls in every in-tree voice subfeature so callers
# can opt into the full STT + TTS scaffold with a single flag. Per
# WEFT-212 this MUST include voice-stt and voice-tts; previously the
# umbrella only enabled VAD + wake, which left voice-stt and
# voice-tts orphaned and meant `cargo build --features voice` built
# a silently-incomplete pipeline.
voice = ["voice-vad", "voice-wake", "voice-stt", "voice-tts", "dep:tokio"]
voice-stt = []
voice-tts = []
voice-vad = []
# Transitional wake API (stub backend). Included in the `voice` umbrella.
voice-wake = []
# Experimental: reserve rustpotter fail-closed API (WEFT-216).
# Does NOT pull `dep:rustpotter` — crates.io rustpotter 3.0.2 depends on
# candle-core 0.2.2 which fails to compile on this workspace toolchain.
# Enabling this feature only compiles the try_with_rustpotter() path that
# returns NotImplemented with RUSTPOTTER_BLOCKED_REASON. Pulls the `voice`
# umbrella so the module is compiled (lib.rs gates `mod voice` on `voice`).
# Concrete alternative: OpenWakeWord-style ONNX KWS via clawft-voice-onnx.
# See docs/plans/wave-0k-WEFT-216-result.md.
voice-wake-rustpotter = ["voice"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
chrono = { workspace = true }
tracing = { workspace = true }
semver = "1"
reqwest = { workspace = true, default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
# SC-2 / WEFT-223: AudioRetention + SecureAudioBuffer for voice capture/transcript.
clawft-types = { workspace = true }
zeroize = { workspace = true }
# WEFT-215: SHA-256 verify of downloaded voice models + hex digests.
sha2 = { workspace = true }
hex = "0.4"
# Streaming download body for progress reporting (bytes_stream).
futures-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
# Fixture HTTP server for WEFT-215 model download tests.
wiremock = "0.6"
