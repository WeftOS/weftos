[package]
name = "weftos-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Mesh object store (ADR-126): name-to-bucket mapping, grants, governed access, audit. No kernel dependency."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
# RustFS transport (ADR-126 S1, owner-approved 2026-11-07): S3 data plane + admin API over HTTP,
# SigV4-signed with the workspace hmac/sha2.
reqwest = { workspace = true, features = ["blocking"], optional = true }
hmac = { workspace = true, optional = true }
# sha2 is also used by the worktree sharing manifest (ADR-126 S2), so it is always on.
sha2 = { workspace = true }
# Optional: wake the drive watcher on file-system events instead of only on its poll timer. Already a
# workspace dependency (clawft-core, clawft-services); the diff gate does not count a workspace = true
# entry for it as new. The scanner stays the source of truth either way.
notify = { workspace = true, optional = true }

[features]
default = []
rustfs = ["dep:reqwest", "dep:hmac"]
drive-notify = ["dep:notify"]

[dev-dependencies]
tempfile = { workspace = true }
