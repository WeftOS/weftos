[package]
name = "weftos-release"
version.workspace = true
# rationale: ADR-126 S4 release-store semantics; consumed by the daemon and CI tooling in-tree.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADR-126 S4: write-once, hash-referenced, signed release stores with retention. Backend-agnostic; the weftos-store S3 client implements the backend trait."

[dependencies]
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
weftos-pq-sign = { workspace = true }
weftos-store = { path = "../weftos-store", optional = true }
tokio = { workspace = true, optional = true }

[features]
# ReleaseBackend over weftos-store's ObjectBackend (RustFS or any S1 backend).
store = ["dep:weftos-store", "dep:tokio"]

[dev-dependencies]
weftos-store = { path = "../weftos-store", features = ["rustfs"] }
tempfile = { workspace = true }
tokio = { workspace = true }
# ADR-126 integration tests (S1 x S4, S1 x S3): in-tree crates only, test-only edges.
weftos-store = { path = "../weftos-store", features = ["rustfs"] }
weftos-edge-creds = { path = "../weftos-edge-creds" }
tempfile = { workspace = true }
serde_json = { workspace = true }
