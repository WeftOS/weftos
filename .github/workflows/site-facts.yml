# Keeps the numbers on the docs-site home page, the root README and the WeftOS
# org profile (WeftOS/.github) in step with the code.
#
#   check    On changes that move a number: `scripts/build.sh gen-facts --check`
#            fails when docs/src/public/facts.json or the README facts block is stale.
#            Fix: scripts/build.sh gen-facts --update-readme, commit the result.
#   publish  After the "Release" workflow succeeds on a tag: regenerate facts.json
#            from that tag, attach it to the GitHub release, and send a
#            `weftos-release` repository_dispatch to WeftOS/.github so the org
#            profile refreshes at once (it also refreshes daily on its own).
#
# The README and facts.json in the tree are never committed by automation (no
# bot pushes to the release branches); the check job is what keeps them current.
#
# PROFILE REFRESH. The WeftOS/.github org profile reads facts.json from the
# docs site on its own daily schedule (and on manual runs), so no cross-repo
# token or GitHub App is needed here.
name: Site facts

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'crates/*/Cargo.toml'
      - 'docs/adr/**'
      - 'docs/reference/cli.md'
      - 'docs/src/public/facts.json'
      - 'README.md'
      - 'scripts/gen-facts.mjs'
      - '.github/workflows/site-facts.yml'
  push:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'crates/*/Cargo.toml'
      - 'docs/adr/**'
      - 'docs/reference/cli.md'
      - 'docs/src/public/facts.json'
      - 'README.md'
      - 'scripts/gen-facts.mjs'
      - '.github/workflows/site-facts.yml'
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check facts are current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build.sh gen-facts --check

  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate facts.json from the tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build.sh gen-facts
      - name: Attach facts.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" docs/src/public/facts.json --clobber
